[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Churn Prediction"
version = "0.1.0"
description = "Cold-Start Churn Prediction for Organizational Decision-Making: Scaling Laws of Zero-Shot Rubric Models vs. Supervised Baselines"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "pandas",
    "numpy",
    "kagglehub",
    "typesafe_sdk",
    "python-dotenv",
    "scikit-learn",
    "duckdb"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 88